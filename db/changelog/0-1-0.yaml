databaseChangeLog:
    - changeSet:
          id: "0"
          author: johann
          changes:
              - sql:
                    sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    - changeSet:
          id: "1"
          author: johann
          changes:
              - createTable:
                    tableName: boat_class
                    columns:
                        - column:
                              name: id
                              type: UUID
                              defaultValueComputed: uuid_generate_v4()
                              constraints:
                                  primaryKey: true
                                  nullable: false
                        - column:
                              name: name
                              type: varchar(50)
                              constraints:
                                  nullable: false
                        - column:
                              name: length
                              type: REAL
                        - column:
                              name: width
                              type: REAL
                        - column:
                              name: foiling
                              type: boolean
