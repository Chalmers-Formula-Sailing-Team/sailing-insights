    - changeSet:
          id: "11"
          author: johann
          changes:
              - addForeignKeyConstraint:
                    baseTableName: boat
                    baseColumnNames: class_id
                    referencedTableName: boat_class
                    referencedColumnNames: id
                    constraintName: fk_boat_class
              - addForeignKeyConstraint:
                    baseTableName: session
                    baseColumnNames: boat_id
                    referencedTableName: boat
                    referencedColumnNames: id
                    constraintName: fk_session_boat
              - addForeignKeyConstraint:
                    baseTableName: session_metric
                    baseColumnNames: session_id
                    referencedTableName: session
                    referencedColumnNames: id
                    constraintName: fk_session_metric_session
                    onDelete: CASCADE
              - addForeignKeyConstraint:
                    baseTableName: session_event
                    baseColumnNames: session_id
                    referencedTableName: session
                    referencedColumnNames: id
                    constraintName: fk_session_event_session
                    onDelete: CASCADE
              - addForeignKeyConstraint:
                    baseTableName: session_channel
                    baseColumnNames: session_id
                    referencedTableName: session
                    referencedColumnNames: id
                    constraintName: fk_session_channel_session
                    onDelete: CASCADE
              - addForeignKeyConstraint:
                    baseTableName: channel_data_real
                    baseColumnNames: channel_id
                    referencedTableName: session_channel
                    referencedColumnNames: id
                    constraintName: fk_channel_data_real_channel
                    onDelete: CASCADE
              - addForeignKeyConstraint:
                    baseTableName: channel_data_boolean
                    baseColumnNames: channel_id
                    referencedTableName: session_channel
                    referencedColumnNames: id
                    constraintName: fk_channel_data_boolean_channel
                    onDelete: CASCADE
              - addForeignKeyConstraint:
                    baseTableName: channel_data_string
                    baseColumnNames: channel_id
                    referencedTableName: session_channel
                    referencedColumnNames: id
                    constraintName: fk_channel_data_string_channel
                    onDelete: CASCADE
              - addForeignKeyConstraint:
                    baseTableName: provenance_record
                    baseColumnNames: session_id
                    referencedTableName: session
                    referencedColumnNames: id
                    constraintName: fk_provenance_record_session
                    onDelete: CASCADE
    - changeSet:
          id: "12"
          author: johann
          changes:
              - sql:
                    sql: 
                        ALTER TABLE channel_data_real
                          ALTER COLUMN "timestamp" TYPE TIMESTAMP WITH TIME ZONE
                          USING "timestamp" AT TIME ZONE 'UTC';
                        ALTER TABLE channel_data_boolean
                          ALTER COLUMN "timestamp" TYPE TIMESTAMP WITH TIME ZONE
                          USING "timestamp" AT TIME ZONE 'UTC';
                        ALTER TABLE channel_data_string
                          ALTER COLUMN "timestamp" TYPE TIMESTAMP WITH TIME ZONE
                          USING "timestamp" AT TIME ZONE 'UTC';
