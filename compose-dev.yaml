services:
  db-dev:
    profiles: ["dev"]
    image: postgres:18
    container_name: postgres_db_sailing_dev
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "5435:5432"
    volumes:
      - ./data/dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
